<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服务器开小差了 | 萤火虫博客</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f9fb;
        --fg: #1f2430;
        --muted: #6b7280;
        --accent: #3b82f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1117;
          --fg: #e5e7eb;
          --muted: #9ca3af;
          --accent: #60a5fa;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .card { text-align: center; padding: 40px 24px; }
      .code {
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
        color: var(--accent);
        margin: 0 0 16px;
      }
      .msg { font-size: 18px; margin: 0 0 8px; }
      .sub { font-size: 14px; color: var(--muted); margin: 0 0 32px; }
      a {
        display: inline-block;
        color: var(--accent);
        text-decoration: none;
        border: 1px solid currentColor;
        border-radius: 8px;
        padding: 8px 20px;
        font-size: 14px;
      }
      a:hover { opacity: 0.8; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">50x</p>
      <p class="msg">服务器开小差了</p>
      <p class="sub">服务暂时不可用，请稍后刷新重试</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
