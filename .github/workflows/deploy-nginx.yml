# ============================================
# myFireflyBlog — Nginx 配置独立部署
# ============================================
# 触发方式: GitHub Actions 页面手动触发 (workflow_dispatch)
#
# 用途: 单独更新 nginx 配置，不触发博客内容构建
# 流程: envsubst 替换模板变量 → SCP 上传 → nginx -t 测试 → nginx -s reload
#
# 前置条件 — 在 GitHub 仓库设置中添加以下 Secrets:
#   - SERVER_HOST: 服务器 IP (替换为你的服务器 IP)
#   - SERVER_USERNAME: SSH 用户名 (替换为你的 SSH 登录名)
#   - SERVER_SSH_KEY: SSH 私钥内容
#   - BLOG_DOMAIN: 博客域名或服务器 IP (替换为你的域名或服务器 IP)
# ============================================

name: Deploy Nginx Config

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Nginx config template path'
        required: true
        default: 'server/nginx/default.conf.template'

jobs:
  deploy-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Substitute env vars
        env:
          BLOG_DOMAIN: ${{ secrets.BLOG_DOMAIN }}
          DEV_MACHINE_IP: ${{ secrets.DEV_MACHINE_IP }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p server/nginx
          envsubst '${BLOG_DOMAIN} ${DEV_MACHINE_IP} ${SERVER_HOST}' < "${{ inputs.config_file }}" > server/nginx/default.conf
          echo "✅ Config generated:"
          cat server/nginx/default.conf

      - name: 📤 Upload config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "server/nginx/default.conf"
          target: "/root/cc/nginx/conf/"
          strip_components: 2
          rm: true

      - name: 🔄 Restart container to pick up new config
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "🧪 确保配置目录与共享网络存在..."
            mkdir -p /root/cc/nginx/conf
            docker network inspect coze-net >/dev/null 2>&1 || docker network create coze-net

            echo "🧪 用临时容器校验新配置语法（加入 coze-net 以解析 coze-gateway 上游）..."
            docker run --rm \
              --network coze-net \
              -v /root/cc/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro \
              -v /root/cc/nginx/ssl:/etc/nginx/ssl:ro \
              nginx:alpine nginx -t

            echo "🔄 重启博客容器（SCP 创建了新 inode，须重启才能重新挂载）..."
            docker restart myFireflyBlog

            echo "✅ Nginx 配置更新完成"
